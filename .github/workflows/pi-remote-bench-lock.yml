name: Refresh Pi remote benchmark locks

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pi-remote-bench-20261114
    paths:
      - ".github/workflows/pi-remote-bench-lock.yml"

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/pi-remote-bench-20261114
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Create benchmark lockfile
        run: npm install --prefix experiments/pi-remote-bench --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json experiments/pi-remote-bench/package-lock.json && [ -f experiments/pi-remote-bench/package-lock.json ]; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json experiments/pi-remote-bench/package-lock.json
          git commit -m "chore(pi-bench): 刷新远端构建锁文件"
          git push
